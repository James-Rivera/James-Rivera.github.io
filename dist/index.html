  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">Network configuration<\u002Fspan>\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">Security fundamentals<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(48px,7vh,80px); padding-top:34px; border-top:1px solid var(--line);\">\n        <div data-rise=\"1\" style=\"display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:22px;\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg);\">Currently exploring<\u002Fspan>\n          <span style=\"margin:0; font-size:15px; line-height:1.7; color:var(--fg55); text-wrap:pretty; font-size:14px; max-width:34em;\">Not in any shipped project — actively learning.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">LLM-powered apps<\u002Fspan>\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">Semantic retrieval<\u002Fspan>\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">Embeddings<\u002Fspan>\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">STM32<\u002Fspan>\n        <span data-chip=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; padding:11px 16px; border:1px solid var(--line); color:var(--fg62); transition:opacity .4s ease, border-color .4s ease, color .4s ease;\">Embedded systems<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"How I work\" style=\"padding:0 clamp(24px,4vw,64px) clamp(120px,22vh,250px);\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding-bottom:30px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg45);\">\n      <span data-rise=\"1\">(05) — How I work<\u002Fspan><span data-rise=\"1\">Six steps, in this order<\u002Fspan>\n    <\u002Fdiv>\n    <div data-steps=\"1\" style=\"margin-top:clamp(44px,7vh,80px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); gap:clamp(22px,2.4vw,38px);\">\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">01<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Observe<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">Standing at the counter watching where the queue actually breaks — not asking anyone what they need.<\u002Fp>\n      <\u002Fdiv>\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">02<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Define<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">The workflow gets written before the stack does. Most ideas die here, which is the cheapest place to die.<\u002Fp>\n      <\u002Fdiv>\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">03<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Build<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">AI agents do the typing. Requirements, architecture, integration and validation stay mine.<\u002Fp>\n      <\u002Fdiv>\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">04<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Deploy<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">Onto hardware I run myself. Deployment is part of the design, not the step after it.<\u002Fp>\n      <\u002Fdiv>\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">05<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Watch<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">Staff went around the admin queue I built. That is information, not failure.<\u002Fp>\n      <\u002Fdiv>\n      <div data-step=\"1\" style=\"position:relative; padding:22px 0 0; opacity:.22; transition:opacity .55s ease;\">\n        <span style=\"position:absolute; left:0; right:0; top:0; height:1px; background:var(--line);\"><\u002Fspan>\n        <span data-step-fill=\"1\" style=\"position:absolute; left:0; top:0; height:1px; width:0%; background:var(--acc); transition:width .7s cubic-bezier(.16,1,.3,1);\"><\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--fg42); margin-bottom:18px;\">06<\u002Fdiv>\n        <div style=\"font-size:clamp(22px,2.3vw,30px); font-weight:500; letter-spacing:-.03em; margin-bottom:12px;\">Revise<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:var(--fg55); text-wrap:pretty;\">Rebuild around what people actually do — and keep the old path they still trust.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-rise=\"1\" style=\"margin:clamp(56px,8vh,96px) 0 0; max-width:20em; font-size:clamp(20px,2.4vw,32px); line-height:1.32; letter-spacing:-.03em; text-wrap:pretty;\">The judgement is the job. The typing is not.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Principles\" style=\"padding:0 clamp(24px,4vw,64px) clamp(120px,22vh,250px);\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding-bottom:30px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; letter-spacing:.2em; color:var(--fg45);\">\n      <span data-rise=\"1\">(06) — Principles<\u002Fspan><span data-rise=\"1\">Click to advance<\u002Fspan>\n    <\u002Fdiv>\n    <div data-princ=\"1\" style=\"display:grid; grid-template-columns:1fr; margin-top:clamp(40px,7vh,84px); cursor:pointer;\">\n      <blockquote data-p-item=\"0\" style=\"margin:0; grid-area:1 / 1; opacity:1; transform:translateY(0px); transition:opacity .7s ease, transform .9s cubic-bezier(.16,1,.3,1);\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-size:10px; color:var(--fg42); margin-bottom:22px;\">On staying useful<\u002Fdiv>\n        <p style=\"margin:0; max-width:17em; font-size:clamp(28px,4.6vw,68px); line-height:1.08; letter-spacing:-.04em; font-weight:500; text-wrap:balance;\">I don’t chase <span style=\"white-space:nowrap;\"><span data-swap=\"1\" style=\"position:relative; display:inline-block; overflow:visible; vertical-align:bottom; border-bottom:1px dashed var(--fg34);\"><span data-swap-word=\"1\" style=\"display:inline-block; transition:opacity .35s ease, transform .45s cubic-bezier(.16,1,.3,1);\">frameworks<\u002Fspan><span data-swap-art=\"1\" style=\"position:absolute; left:0; top:50%; transform:translateY(-40%); white-space:nowrap; opacity:0; transition:opacity .35s ease .1s; font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0; color:var(--fg); background:var(--surf); border:1px solid var(--surf2); padding:5px 9px;\">npm i whatever@latest — no thanks<\u002Fspan><\u002Fspan>.<\u002Fspan> I learn principles.<\u002Fp>\n      <\u002Fblockquote>\n      <blockquote data-p-item=\"1\" style=\"margin:0; grid-area:1 / 1; opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .9s cubic-bezier(.16,1,.3,1);\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-size:10px; color:var(--fg42); margin-bottom:22px;\">On what the job is<\u002Fdiv>\n        <p style=\"margin:0; max-width:17em; font-size:clamp(28px,4.6vw,68px); line-height:1.08; letter-spacing:-.04em; font-weight:500; text-wrap:balance;\">Great software isn’t written into existence. It comes from understanding <span data-swap=\"1\" style=\"position:relative; display:inline-block; overflow:visible; vertical-align:bottom; border-bottom:1px dashed var(--fg34);\"><span data-swap-word=\"1\" style=\"display:inline-block; transition:opacity .35s ease, transform .45s cubic-bezier(.16,1,.3,1);\">people<\u002Fspan><span data-swap-art=\"1\" style=\"position:absolute; left:0; top:50%; transform:translateY(-40%); white-space:nowrap; opacity:0; transition:opacity .35s ease .1s; font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0; color:var(--fg); background:var(--surf); border:1px solid var(--surf2); padding:5px 9px;\">walk-ins, not personas<\u002Fspan><\u002Fspan> and designing systems that survive being used.<\u002Fp>\n      <\u002Fblockquote>\n      <blockquote data-p-item=\"2\" style=\"margin:0; grid-area:1 / 1; opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .9s cubic-bezier(.16,1,.3,1);\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-size:10px; color:var(--fg42); margin-bottom:22px;\">On why there is always another one<\u002Fdiv>\n        <p style=\"margin:0; max-width:17em; font-size:clamp(28px,4.6vw,68px); line-height:1.08; letter-spacing:-.04em; font-weight:500; text-wrap:balance;\">Every project has to teach me something I didn’t know <span style=\"white-space:nowrap;\"><span data-swap=\"1\" style=\"position:relative; display:inline-block; overflow:visible; vertical-align:bottom; border-bottom:1px dashed var(--fg34);\"><span data-swap-word=\"1\" style=\"display:inline-block; transition:opacity .35s ease, transform .45s cubic-bezier(.16,1,.3,1);\">yesterday<\u002Fspan><span data-swap-art=\"1\" style=\"position:absolute; left:0; top:50%; transform:translateY(-40%); white-space:nowrap; opacity:0; transition:opacity .35s ease .1s; font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0; color:var(--fg); background:var(--surf); border:1px solid var(--surf2); padding:5px 9px;\">git log --since=yesterday<\u002Fspan><\u002Fspan>.<\u002Fspan><\u002Fp>\n      <\u002Fblockquote>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(44px,7vh,80px); display:flex; align-items:center; gap:18px;\">\n      <span data-p-dot=\"0\" style=\"display:block; width:42px; height:2px; background:var(--acc); transition:width .5s cubic-bezier(.16,1,.3,1), background .5s ease;\"><\u002Fspan>\n      <span data-p-dot=\"1\" style=\"display:block; width:18px; height:2px; background:var(--line); transition:width .5s cubic-bezier(.16,1,.3,1), background .5s ease;\"><\u002Fspan>\n      <span data-p-dot=\"2\" style=\"display:block; width:18px; height:2px; background:var(--line); transition:width .5s cubic-bezier(.16,1,.3,1), background .5s ease;\"><\u002Fspan>\n      <span data-p-count=\"1\" style=\"margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-size:10px; color:var(--fg42);\">01 / 03<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Questions\" style=\"padding:0 clamp(24px,4vw,64px) clamp(120px,22vh,250px);\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding-bottom:30px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg45);\">\n      <span data-rise=\"1\">(07) — Ask me something<\u002Fspan><span data-rise=\"1\">Pick a question<\u002Fspan>\n    <\u002Fdiv>\n    <div data-qa=\"1\" style=\"margin-top:clamp(44px,7vh,84px);\">\n      <div data-rise=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); margin-bottom:26px;\">rivera@portfolio ~ %<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr;\">\n      <div data-qa-item=\"0\" style=\"grid-area:1 / 1; opacity:1; transform:translateY(0px); pointer-events:auto; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);\">\n        <h3 style=\"margin:0; font-size:clamp(28px,4.4vw,62px); font-weight:500; letter-spacing:-.04em; line-height:1.04; text-wrap:balance;\">Can you design and build it?<\u002Fh3>\n        <p style=\"margin:28px 0 0; max-width:24em; font-size:clamp(17px,1.7vw,21px); line-height:1.55; color:var(--fg62); text-wrap:pretty;\">Yes — the same person decides what it should do, designs it, writes it, and puts it on the server. Nothing gets lost in a handoff because there isn’t one.<\u002Fp>\n      <\u002Fdiv>\n      <div data-qa-item=\"1\" style=\"grid-area:1 / 1; opacity:0; transform:translateY(14px); pointer-events:none; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);\">\n        <h3 style=\"margin:0; font-size:clamp(28px,4.4vw,62px); font-weight:500; letter-spacing:-.04em; line-height:1.04; text-wrap:balance;\">Have you shipped anything real?<\u002Fh3>\n        <p style=\"margin:28px 0 0; max-width:24em; font-size:clamp(17px,1.7vw,21px); line-height:1.55; color:var(--fg62); text-wrap:pretty;\">FlowPress runs at our family shop every day, and I have two client projects in progress right now. Not demos, not coursework.<\u002Fp>\n      <\u002Fdiv>\n      <div data-qa-item=\"2\" style=\"grid-area:1 / 1; opacity:0; transform:translateY(14px); pointer-events:none; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);\">\n        <h3 style=\"margin:0; font-size:clamp(28px,4.4vw,62px); font-weight:500; letter-spacing:-.04em; line-height:1.04; text-wrap:balance;\">What have you gotten wrong?<\u002Fh3>\n        <p style=\"margin:28px 0 0; max-width:24em; font-size:clamp(17px,1.7vw,21px); line-height:1.55; color:var(--fg62); text-wrap:pretty;\">Plenty. The admin queue I built for FlowPress was bypassed by the staff it was for. I still lack a lot — I treat that as the job, not an admission. Eternal student.<\u002Fp>\n      <\u002Fdiv>\n      <div data-qa-item=\"3\" style=\"grid-area:1 / 1; opacity:0; transform:translateY(14px); pointer-events:none; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);\">\n        <h3 style=\"margin:0; font-size:clamp(28px,4.4vw,62px); font-weight:500; letter-spacing:-.04em; line-height:1.04; text-wrap:balance;\">Do you actually use AI to code?<\u002Fh3>\n        <p style=\"margin:28px 0 0; max-width:24em; font-size:clamp(17px,1.7vw,21px); line-height:1.55; color:var(--fg62); text-wrap:pretty;\">Yes, as an implementation partner. I carry a heavy load between school, the shop and client work, so agents do typing I would otherwise do slowly. Requirements, architecture, debugging and deployment stay mine.<\u002Fp>\n      <\u002Fdiv>\n      <div data-qa-item=\"4\" style=\"grid-area:1 / 1; opacity:0; transform:translateY(14px); pointer-events:none; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);\">\n        <h3 style=\"margin:0; font-size:clamp(28px,4.4vw,62px); font-weight:500; letter-spacing:-.04em; line-height:1.04; text-wrap:balance;\">What are you looking for?<\u002Fh3>\n        <p style=\"margin:28px 0 0; max-width:24em; font-size:clamp(17px,1.7vw,21px); line-height:1.55; color:var(--fg62); text-wrap:pretty;\">An internship or a small team where I can own a problem end to end — talk to users, decide what to build, ship it, then watch what happens. Ideally somewhere that lets me stay close to the operational side.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rise=\"1\" style=\"margin-top:clamp(48px,7vh,80px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg45); margin-bottom:18px;\">Ask me something<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n        <button data-qa-btn=\"0\" type=\"button\" style=\"appearance:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; padding:12px 16px; border:1px solid var(--acc); background:transparent; color:var(--fg); transition:border-color .35s ease, color .35s ease;\">design AND build?<\u002Fbutton>\n        <button data-qa-btn=\"1\" type=\"button\" style=\"appearance:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; padding:12px 16px; border:1px solid var(--line); background:transparent; color:var(--fg50); transition:border-color .35s ease, color .35s ease;\">shipped anything real?<\u002Fbutton>\n        <button data-qa-btn=\"2\" type=\"button\" style=\"appearance:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; padding:12px 16px; border:1px solid var(--line); background:transparent; color:var(--fg50); transition:border-color .35s ease, color .35s ease;\">what have you gotten wrong?<\u002Fbutton>\n        <button data-qa-btn=\"3\" type=\"button\" style=\"appearance:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; padding:12px 16px; border:1px solid var(--line); background:transparent; color:var(--fg50); transition:border-color .35s ease, color .35s ease;\">do you use AI?<\u002Fbutton>\n        <button data-qa-btn=\"4\" type=\"button\" style=\"appearance:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; padding:12px 16px; border:1px solid var(--line); background:transparent; color:var(--fg50); transition:border-color .35s ease, color .35s ease;\">what are you looking for?<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"contact\" data-screen-label=\"Contact\" style=\"position:relative; padding:clamp(110px,18vh,210px) clamp(24px,4vw,64px) clamp(36px,5vh,54px); border-top:1px solid var(--line); overflow:hidden;\">\n    <div data-rise=\"1\" style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg45); margin-bottom:44px;\">(08) — Contact<\u002Fdiv>\n    <sc-if value=\"{ 28px; flex-wrap:wrap;\">\n        <a href=\"#work\" data-cursor=\"1\">Work<\u002Fa>\n        <a href=\"flowpress.html\" data-cursor=\"1\">FlowPress<\u002Fa>\n        <a href=\"konektado.html\" data-cursor=\"1\">Konektado<\u002Fa>\n        <a href=\"https://github.com/James-Rivera\" target=\"_blank\" rel=\"noreferrer\" data-cursor=\"1\">GitHub<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:28px; flex-wrap:wrap; align-items:baseline;\">\n        <span>Batangas <span data-clock=\"1\" style=\"color:var(--fg);\">—:—:—<\u002Fspan><\u002Fspan>\n        <span>© 2026 James Carlo Rivera<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;jamescarlorivera52@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;linkedin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;resume&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F5FEF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1F5FEF&quot;,&quot;#F2B441&quot;,&quot;#4FD1C5&quot;,&quot;#EF4E2C&quot;],&quot;section&quot;:&quot;Water&quot;},&quot;waveIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Water&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;customCursor&quot;:{&quot;editor&quot;:
